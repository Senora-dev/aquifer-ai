name: Bug report
description: Something in Aquifer does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please **do not** include tokens, credentials, AWS account ids,
        or content from private repositories. For security issues, see SECURITY.md instead.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Local mode (`python -m aquifer.local`) reproductions are easiest for us to run.
  - type: input
    id: version
    attributes:
      label: Aquifer version or commit
  - type: dropdown
    id: where
    attributes:
      label: Where does it happen?
      options:
        - Local mode
        - Deployed stack (AWS)
        - CDK synth / deploy
        - Tests / benchmark
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs (redacted)
      render: text
